name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without the v prefix"
        required: true
        default: "0.5.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install native inference build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install torch --index-url https://download.pytorch.org/whl/cu130
          python -m pip install diffusers transformers safetensors huggingface_hub tokenizers pillow numpy accelerate ftfy imageio imageio-ffmpeg sentencepiece

      - name: Build Windows release
        shell: powershell
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}".TrimStart("v")
          }
          "CINEFORGE_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ./packaging/Build-Release.ps1 -Version $version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineForge-${{ env.CINEFORGE_RELEASE_VERSION }}-win-x64
          path: release/CineForge-${{ env.CINEFORGE_RELEASE_VERSION }}-win-x64/*

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            --title "CineForge Desktop $env:GITHUB_REF_NAME" `
            --prerelease `
            --notes-file "release/CineForge-$env:CINEFORGE_RELEASE_VERSION-win-x64/RELEASE_NOTES.md" `
            "release/CineForge-$env:CINEFORGE_RELEASE_VERSION-win-x64/*"
